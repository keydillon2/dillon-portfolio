# Checks every pull request before it can merge into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Workflow tokens are read-only unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values (they appear in every image URL); no secrets are needed to build.
      NEXT_PUBLIC_SANITY_PROJECT_ID: 7sgn2ssa
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint app lib sanity
      - run: npx next build
